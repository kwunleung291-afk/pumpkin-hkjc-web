<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>南瓜仔紙盤</title>
  <style>
:root {
  --bg: #0b0f14;
  --bg2: #121821;
  --card: #171e29;
  --card2: #1c2431;
  --line: #2a3444;
  --text: #e8eef7;
  --muted: #9aa8bc;
  --accent: #3dd68c;
  --accent2: #5b8cff;
  --warn: #f5b942;
  --bad: #ff6b7a;
  --ok: #3dd68c;
  --pill: #243041;
  --radius: 14px;
  --shadow: 0 8px 24px rgba(0,0,0,.35);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body {
  min-height: 100dvh;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: var(--accent2); }

.app {
  max-width: 390px;
  margin: 0 auto;
  padding: 0 12px calc(28px + var(--safe-bottom));
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(11,15,20,.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding: 12px 0 10px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  margin: 0 -12px;
  padding-left: 12px;
  padding-right: 12px;
}

.brand {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.brand h1 {
  margin: 0;
  font-size: 1.15rem;
  font-weight: 750;
  letter-spacing: .02em;
}
.brand .meta {
  color: var(--muted);
  font-size: .78rem;
  text-align: right;
}
.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.chip {
  background: var(--pill);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: .75rem;
}
.chip.ok { border-color: rgba(61,214,140,.45); color: var(--ok); }
.chip.bad { border-color: rgba(255,107,122,.45); color: var(--bad); }
.chip.warn { border-color: rgba(245,185,66,.45); color: var(--warn); }

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 12px 0 14px;
}
.tab {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--bg2);
  color: var(--muted);
  border-radius: 12px;
  padding: 12px 10px;
  font-size: .95rem;
  font-weight: 650;
  min-height: 44px;
  cursor: pointer;
}
.tab.active {
  background: linear-gradient(180deg, #223049, #1a2433);
  color: var(--text);
  border-color: #3a4d6a;
  box-shadow: inset 0 0 0 1px rgba(91,140,255,.25);
}

.panel { display: none; }
.panel.active { display: block; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin: 0 0 12px;
  box-shadow: var(--shadow);
}
.card-head {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: flex-start;
}
.kick {
  color: var(--muted);
  font-size: .78rem;
}
.idpill {
  font-size: .72rem;
  background: var(--pill);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 3px 7px;
  color: var(--muted);
  white-space: nowrap;
}
.tour {
  margin: 6px 0 2px;
  color: var(--muted);
  font-size: .8rem;
}
.teams {
  font-size: 1.05rem;
  font-weight: 700;
  margin: 2px 0 10px;
}

.pick {
  background: var(--card2);
  border: 1px solid #2f3c50;
  border-radius: 12px;
  padding: 12px;
}
.pick-main {
  font-size: 1.12rem;
  font-weight: 750;
  color: var(--accent);
}
.pick-sub {
  margin-top: 4px;
  color: var(--muted);
  font-size: .86rem;
}
.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.pill {
  background: var(--pill);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 10px;
  font-size: .78rem;
}
.pill.status-hit { color: var(--ok); border-color: rgba(61,214,140,.5); }
.pill.status-miss { color: var(--bad); border-color: rgba(255,107,122,.5); }
.pill.status-pending { color: var(--warn); border-color: rgba(245,185,66,.45); }
.pill.conf-high { color: var(--accent); }
.pill.conf-medium { color: var(--accent2); }

.pill.conf-low { color: var(--muted); }

.options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 4px 0 2px;
}
.option {
  background: var(--card2);
  border: 1px solid #2f3c50;
  border-radius: 12px;
  padding: 10px 12px;
  border-left-width: 4px;
}
.option.risk-low { border-left-color: var(--ok); }
.option.risk-medium { border-left-color: var(--accent2); }
.option.risk-high { border-left-color: var(--warn); }
.option-head {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 6px;
}
.risk-badge {
  font-size: .78rem;
  font-weight: 750;
  border-radius: 999px;
  padding: 4px 10px;
  border: 1px solid var(--line);
}
.risk-badge.risk-low {
  color: var(--ok);
  border-color: rgba(61,214,140,.5);
  background: rgba(61,214,140,.08);
}
.risk-badge.risk-medium {
  color: var(--accent2);
  border-color: rgba(91,140,255,.5);
  background: rgba(91,140,255,.08);
}
.risk-badge.risk-high {
  color: var(--warn);
  border-color: rgba(245,185,66,.5);
  background: rgba(245,185,66,.08);
}
.pill.ge60 {
  color: var(--ok);
  border-color: rgba(61,214,140,.55);
  font-weight: 700;
}
.option-pick {
  font-size: 1.02rem;
  font-weight: 750;
  color: var(--text);
}
.option.risk-low .option-pick { color: var(--accent); }
.option-prob {
  margin-top: 3px;
  color: var(--muted);
  font-size: .8rem;
}
.option-sum {
  margin: 6px 0 0;
  font-size: .84rem;
  color: var(--muted);
  line-height: 1.4;
}


.summary {
  margin-top: 12px;
  padding: 10px 0 0 10px;
  border-top: 1px dashed #2c384a;
  border-left: 3px solid rgba(61,214,140,.55);
}
.summary h3 {
  margin: 0 0 6px;
  font-size: .85rem;
  color: var(--accent);
  font-weight: 700;
  letter-spacing: .04em;
}
.summary p {
  margin: 0;
  font-size: .92rem;
  color: var(--text);
}

details.more {
  margin-top: 10px;
}
details.more > summary {
  list-style: none;
  cursor: pointer;
  user-select: none;
  background: #141b26;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: .88rem;
  font-weight: 650;
  min-height: 44px;
  display: flex;
  align-items: center;
}
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after {
  content: "＋";
  margin-left: auto;
  color: var(--muted);
}
details.more[open] > summary::after { content: "－"; }
.more-body {
  margin-top: 8px;
  padding: 10px 12px;
  background: #10161f;
  border-radius: 10px;
  border: 1px solid var(--line);
  font-size: .84rem;
  color: var(--muted);
  word-break: break-word;
}
.more-body dt {
  color: var(--accent2);
  font-weight: 650;
  margin-top: 8px;
}
.more-body dd { margin: 2px 0 0; }
.more-body ul { margin: 4px 0 0; padding-left: 1.1em; }

.review-hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.statbox {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
}
.statbox .n {
  font-size: 1.35rem;
  font-weight: 780;
}
.statbox .l {
  color: var(--muted);
  font-size: .75rem;
}
.patterns {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
  font-size: .86rem;
}
.patterns h3 { margin: 0 0 6px; font-size: .9rem; }
.patterns li { margin: 4px 0; color: var(--muted); }

.rev-card .result {
  margin-top: 8px;
  font-size: .88rem;
  color: var(--muted);
}

.footer {
  margin-top: 18px;
  padding: 14px 4px 8px;
  color: var(--muted);
  font-size: .75rem;
  text-align: center;
  border-top: 1px solid var(--line);
}
.empty {
  color: var(--muted);
  text-align: center;
  padding: 28px 10px;
}
.loading { color: var(--muted); padding: 24px 8px; text-align: center; }

.chip.cal { border-color: rgba(91,140,255,.45); color: var(--accent2); }
.pill.cal { border-color: rgba(91,140,255,.4); color: var(--accent2); }
.cal-strip {
  margin-top: 8px;
  padding: 8px 10px;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: .72rem;
  color: var(--muted);
  line-height: 1.4;
}
.cal-strip .cal-metrics { margin-top: 4px; color: var(--text); opacity: .85; }
.review-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>南瓜仔紙盤</h1>
        <div class="meta">
          <div>as_of</div>
          <div id="as-of">—</div>
        </div>
      </div>
      <div class="stats" id="stat-chips"></div>
    </header>
    <nav class="tabs" aria-label="分頁">
      <button class="tab active" type="button" data-tab="tips">今日建議</button>
      <button class="tab" type="button" data-tab="review">覆盤</button>
    </nav>
    <section id="panel-tips" class="panel active" aria-label="今日建議">
      <div id="tips-list" class="loading">載入緊…</div>
    </section>
    <section id="panel-review" class="panel" aria-label="覆盤">
      <div id="review-hero" class="review-hero"></div>
      <div id="review-patterns"></div>
      <div id="review-list"></div>
    </section>
    <footer class="footer">
      <div id="footer-note">紙盤分析，唔係投注建議。</div>
      <div style="margin-top:6px">HKT · 南瓜仔 HKJC paper tips</div>
    </footer>
  </div>
  <script>
window.__PUMPKIN_EMBEDDED__ = {
  "generated_at_hkt": "2026-10-26 12:02:28 HKT",
  "as_of_hkt": "2026-10-26 12:02:26 HKT",

  "policy": {

    ],
    "prefer_prob_pct": 60,
    "chl_low_risk": "blocked unless weather corners signal",
    "hil_over_high_line_low_risk": "blocked when line≥3.5 (Shonan lesson)",
    "min_odds_prefer": 1.7,
    "short_odds": "HKJC odds <1.70 預設唔推（冇肉）；低風險永不接受；中／高僅全場無肉時例外湊位",
    "probability": "估計機率 = 加權混合：ESPN/DraftKings de-vig公允、DATA4MULA HAD_OS de-vig、TipsAudit尖市公允、馬會盤口去水、Poisson(近況GF/GA + 聯賽ρ)、歷史Elo（football-data）／形勢Elo、FD 校準基線；Bayes logit 收縮；訊號/評述/走盤；再經覆盤 isotonic 機率校準（樣本少會誠實收縮）；blend／市場權重讀 model_weights.json；收盤CLV快照＋效率門檻；跨場同向守衛；Kelly；唔係賽果保證",
    "risk_definition": "低風險＝最高校準估計機率（優先≥60%）、水位≥1.70 主盤（角球／高線大波≥3.5／水位<1.70 永遠排除）；中風險＝中段水位（≥1.70）同模型分；高風險＝較長賠率／較高上行但仍有理由（唔係亂槍）；水位<1.70 預設唔推（冇肉），僅中／高全場無肉時例外湊位並降注"
  },
  "hit_rate": null,
  "cross_match_guard": {
    "active": false,
    "n": 0,
    "reason": "too_few_picks"
  },
  "calibration": {
    "n_settled": 16,
    "honesty_zh": "樣本太少（n=16 < 20）：唔做完整校準，只向經驗命中率 38% 輕微收縮",
    "identity": true,
    "brier_raw": 0.2192,
    "brier_calibrated": 0.2167,
    "rolling": {
      "7d": {

      }
    }
  },
  "rolling_7d": {

  },
  "rolling_30d": {

    "hit": 6,
    "miss": 10,
    "hit_rate": 0.375,
    "brier": 0.2202
  },
  "odds_compare_coverage": "EMPTY — external 0/0 (D4M 0.0% ESPN 0.0% TipsAudit 0.0%)",
  "toxic_train": "cached — soft≥2.5pp n=14320 @ 2026-10-25 19:17:08 HKT",
  "sources": {
    "HKJC": "OK — window 0 / raw 32",
    "Overseas ESPN/DK": "OK — linked 0/0 (leagues none; odds_api=skipped (no THE_ODDS_API_KEY))",
    "DATA4MULA": "OK — linked 0/0 (fb_map 31, odds 31)",
    "FotMob": "OK — linked 0, detailed 0, near_KO_XI 0",
    "7M": "PARTIAL — linked 0/0 (catalogue 41)",
    "X": "EMPTY — linked 0/0 (raw_matches 10)",
    "Signals": "EMPTY — linked 0/0 (weather 0, standings 0, line_move 0, xg_recent 0)",
    "TipsAudit": "PARTIAL — linked 0/0 (catalogue 319)",
    "OddsCompare": "EMPTY — external 0/0 (D4M 0.0% ESPN 0.0% TipsAudit 0.0%)",
    "ToxicTrain": "cached — soft≥2.5pp n=14320 @ 2026-10-25 19:17:08 HKT",
    "HistoricalElo/ρ": "cached — matches 37859 teams 439 ρ=-0.033",
    "Calibration": "n=16 identity=True brier_raw=0.2192→cal=0.2167 | 樣本太少（n=16 < 20）：唔做完整校準，只向經驗命中率 38% 輕微收縮"
  },
  "attribution_footer": "Fair odds reference includes TipsAudit (tipsaudit.com). External books are never tipped.",
  "settlement_summary": {
    "as_of_hkt": "2026-10-26 12:02:28 HKT",
    "tips_as_of": "2026-10-26 12:02:26 HKT",
    "n_tips": 0,
    "n_settled": 0,
    "n_pending": 0,
    "n_hit": 0,
    "n_miss": 0,
    "hit_rate": null,
    "brier": null,
    "paper_pnl": 0.0,
    "by_market": {},
    "clv_by_quality": {},
    "error_patterns": []
  },
  "tips": [],
  "review_rows": [],
  "disclaimer": "紙盤分析，唔係投注建議。估計機率（已盡量校準）唔保證命中。18歲以下唔准。請理性博彩。"
}
;
(function () {
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

  function esc(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function statusClass(settlement) {
    if (settlement === "HIT") return "status-hit";
    if (settlement === "MISS") return "status-miss";
    return "status-pending";
  }

  function confClass(c) {
    const k = String(c || "").toLowerCase();
    if (k === "high") return "conf-high";
    if (k === "low") return "conf-low";
    return "conf-medium";
  }

  function riskClass(tier) {
    const k = String(tier || "").toLowerCase();
    if (k === "low") return "risk-low";
    if (k === "high") return "risk-high";
    return "risk-medium";
  }

  function pct(n) {
    if (n == null || Number.isNaN(Number(n))) return "—";
    return (Number(n) * 100).toFixed(1) + "%";
  }

  function renderOption(o) {
    const odds = o.hkjc_odds != null ? `@ ${esc(o.hkjc_odds)}` : "";
    const calTag = o.calibrated ? "校準" : "估計";
    let prob =
      o.est_prob_pct != null ? `${calTag} ${esc(o.est_prob_pct)}%` : "";
    if (
      o.calibrated &&
      o.est_prob_raw_pct != null &&
      Math.abs(Number(o.est_prob_raw_pct) - Number(o.est_prob_pct)) >= 1
    ) {
      prob += `（原 ${esc(o.est_prob_raw_pct)}%）`;
    }
    const ge60 =
      o.est_prob_pct != null && Number(o.est_prob_pct) >= 60
        ? '<span class="pill ge60">≥60%</span>'
        : "";
    const calPill = o.calibrated
      ? '<span class="pill cal">已校準</span>'
      : "";
    return `<div class="option ${riskClass(o.risk_tier)}">
  <div class="option-head">
    <span class="risk-badge ${riskClass(o.risk_tier)}">${esc(
      o.risk_zh || o.risk_tier || "—"
    )}</span>
    ${ge60}${calPill}
    <span class="pill ${confClass(o.confidence)}">信心 ${esc(
      o.confidence_zh || o.confidence || "—"
    )}</span>
    <span class="pill">紙注 ${esc(o.stake ?? "—")}</span>
  </div>
  <div class="option-pick">${esc(o.pick_line || "")} ${odds}</div>
  <div class="option-prob">${prob}${
      o.prob_label ? ` · ${esc(o.prob_label)}` : ""
    }</div>
  <p class="option-sum">${esc(o.summary || "")}</p>
</div>`;
  }

  function renderTips(tips) {
    const root = $("#tips-list");
    if (!tips.length) {
      root.innerHTML = '<div class="empty">暫時未有建議</div>';
      return;
    }
    root.innerHTML = tips
      .map((t) => {
        const options =
          t.options && t.options.length
            ? t.options
            : [
                {
                  risk_tier: t.risk_tier || "low",
                  risk_zh: t.risk_zh || "低風險",
                  pick_line: t.pick_line,
                  hkjc_odds: t.hkjc_odds,
                  est_prob_pct: t.est_prob_pct,
                  prob_label: t.prob_label,
                  confidence: t.confidence,
                  confidence_zh: t.confidence_zh,
                  stake: t.stake,
                  summary: t.summary,
                },
              ];
        const cites = ((t.signals && t.signals.cites) || []).map(
          (c) => `<li>${esc(c)}</li>`
        );
        const narrative = (t.narrative_cites || []).map(
          (c) => `<li>${esc(c)}</li>`
        );
        const bk = t.bookmaker_angle || {};
        const live =
          t.live_score != null
            ? `<div class="result">即時比分 ${esc(t.live_score)}</div>`
            : "";
        const ft =
          t.ft_score != null
            ? `<div class="result">完場 ${esc(t.ft_score)}${
                t.corners ? `｜角球 ${esc(t.corners)}` : ""
              }</div>`
            : "";
        return `<article class="card" data-id="${esc(t.front_end_id)}">
  <div class="card-head">
    <div class="kick">${esc(t.kickoff_hkt)} HKT</div>
    <div class="idpill">${esc(t.front_end_id)}</div>
  </div>
  <div class="tour">${esc(t.tournament)}</div>
  <div class="teams">${esc(t.home.ch)} vs ${esc(t.away.ch)}</div>
  <div class="options">
    ${options.map(renderOption).join("")}
  </div>
  <div class="row">
    <span class="pill ${statusClass(t.settlement)}">${esc(
      t.status_zh || "待結"
    )}</span>
  </div>
  ${live}${ft}
  <div class="summary">
    <h3>分析總結</h3>
    <p>${esc(t.summary)}</p>
  </div>
  <details class="more">
    <summary>詳細</summary>
    <div class="more-body">
      <dl>
        <dt>莊家視角</dt>
        <dd>${esc(bk.intent || "—")}${
          bk.action ? "／" + esc(bk.action) : ""
        }${
          bk.toxicity_score != null ? "／毒性" + esc(bk.toxicity_score) : ""
        }${
          bk.brief_zh ? " — " + esc(bk.brief_zh) : ""
        }</dd>
        ${
          (t.odds_compare && t.odds_compare.brief_zh)
            ? `<dt>跨站對比</dt><dd>${esc(t.odds_compare.brief_zh)}</dd>`
            : ""
        }
        <dt>訊號</dt>
        <dd>${cites.length ? `<ul>${cites.join("")}</ul>` : "—"}</dd>
        ${
          narrative.length
            ? `<dt>敘事引用</dt><dd><ul>${narrative.join("")}</ul></dd>`
            : ""
        }
        ${
          t.form
            ? `<dt>近況</dt><dd>主 ${esc(t.form[0] || "—")}／客 ${esc(
                t.form[1] || "—"
              )}</dd>`
            : ""
        }
        ${
          t.h2h_summary
            ? `<dt>對賽</dt><dd>主勝${esc(t.h2h_summary[0])}／和${esc(
                t.h2h_summary[1]
              )}／客勝${esc(t.h2h_summary[2])}</dd>`
            : ""
        }
        ${
          t.review_zh
            ? `<dt>覆盤備註</dt><dd>${esc(t.review_zh)}</dd>`
            : ""
        }
      </dl>
    </div>
  </details>
</article>`;
      })
      .join("");
  }

  function renderReview(data) {
    const s = data.settlement_summary;
    const hero = $("#review-hero");
    const list = $("#review-list");
    const patterns = $("#review-patterns");
    if (!s) {
      hero.innerHTML = "";
      patterns.innerHTML = "";
      list.innerHTML = '<div class="empty">尚未有覆盤資料</div>';
      return;
    }
    const cal = data.calibration || {};
    const r7 = data.rolling_7d || (cal.rolling && cal.rolling["7d"]) || {};
    hero.innerHTML = `
      <div class="statbox"><div class="n">${esc(pct(s.hit_rate))}</div><div class="l">命中率（已結）</div></div>
      <div class="statbox"><div class="n">${esc(s.n_hit)}/${esc(
      s.n_settled
    )}</div><div class="l">中／已結</div></div>
      <div class="statbox"><div class="n">${esc(
        s.brier != null ? Number(s.brier).toFixed(3) : "—"
      )}</div><div class="l">Brier</div></div>
      <div class="statbox"><div class="n">${esc(
        r7.hit_rate != null ? pct(r7.hit_rate) : "—"
      )}</div><div class="l">近7日命中</div></div>
      <div class="statbox"><div class="n">${esc(s.paper_pnl)}</div><div class="l">紙注損益</div></div>
      <div class="statbox"><div class="n">${esc(s.n_pending)}</div><div class="l">待結</div></div>
    `;
    const bm = s.by_market || {};
    const bmLines = Object.keys(bm)
      .map((k) => {
        const x = bm[k];
        return `<li>${esc(k)}：${esc(x.hit)}/${esc(x.n)}（${esc(
          pct(x.hit_rate)
        )}）</li>`;
      })
      .join("");
    const errs = (s.error_patterns || [])
      .map((e) => `<li>${esc(e)}</li>`)
      .join("");
    patterns.innerHTML = `<div class="patterns">
      <h3>分盤表現</h3>
      <ul>${bmLines || "<li>—</li>"}</ul>
      ${
        errs
          ? `<h3 style="margin-top:10px">誤差模式</h3><ul>${errs}</ul>`
          : ""
      }
      <div style="margin-top:8px;color:var(--muted);font-size:.78rem">覆盤 as_of：${esc(
        s.as_of_hkt || ""
      )}｜對照紙盤 ${esc(s.tips_as_of || "")}</div>
    </div>`;

    const rows = data.review_rows || [];
    if (!rows.length) {
      list.innerHTML = '<div class="empty">無覆盤場次</div>';
      return;
    }
    list.innerHTML = rows
      .map((r) => {
        return `<article class="card rev-card">
  <div class="card-head">
    <div class="kick">${esc(r.kickoff_hkt || "")} HKT</div>
    <div class="idpill">${esc(r.front_end_id)}</div>
  </div>
  <div class="tour">${esc(r.tournament)}</div>
  <div class="teams">${esc(r.home.ch)} vs ${esc(r.away.ch)}</div>
  <div class="pick">
    <div class="pick-main">${esc(r.pick_line)}${
          r.hkjc_odds != null ? " @ " + esc(r.hkjc_odds) : ""
        }</div>
  </div>
  <div class="row">
    <span class="pill ${statusClass(r.settlement)}">${esc(
      r.status_zh || r.settlement || "—"
    )}</span>
    ${
      r.est_prob_pct != null
        ? `<span class="pill">估計 ${esc(r.est_prob_pct)}%</span>`
        : ""
    }
    ${
      r.stake != null ? `<span class="pill">紙注 ${esc(r.stake)}</span>` : ""
    }
  </div>
  <div class="result">${
    r.ft_score != null
      ? `完場 ${esc(r.ft_score)}`
      : esc(r.match_status || "待結")
  }${r.corners ? `｜角球 ${esc(r.corners)}` : ""}${
          r.result_value ? `｜${esc(r.result_value)}` : ""
        }</div>
  ${
    r.review_zh
      ? `<div class="summary"><h3>覆盤</h3><p>${esc(r.review_zh)}</p></div>`
      : ""
  }
</article>`;
      })
      .join("");
  }

  function bindTabs() {
    $$(".tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        $$(".tab").forEach((b) => b.classList.remove("active"));
        $$(".panel").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        const id = btn.getAttribute("data-tab");
        $("#panel-" + id).classList.add("active");
      });
    });
  }

  function rollChip(label, roll) {
    if (!roll || roll.n == null || roll.n === 0) {
      return `<span class="chip">${esc(label)} n=0</span>`;
    }
    const hr = roll.hit_rate != null ? pct(roll.hit_rate) : "—";
    const br = roll.brier != null ? Number(roll.brier).toFixed(3) : "—";
    const cls = roll.hit_rate != null && roll.hit_rate >= 0.5 ? "ok" : "warn";
    return `<span class="chip ${cls}">${esc(label)} ${esc(hr)}｜Brier ${esc(br)}（n=${esc(roll.n)}）</span>`;
  }

  function fillTop(data) {
    $("#as-of").textContent = data.as_of_hkt || "—";
    const chips = $("#stat-chips");
    const parts = [
      `<span class="chip">場次 ${esc(data.matches_count || data.tips_count)}</span>`,
    ];
    if (data.options_total != null) {
      parts.push(`<span class="chip">選項 ${esc(data.options_total)}</span>`);
    }
    if (data.low_risk_ge60 != null) {
      parts.push(
        `<span class="chip ok">低風險≥60% ${esc(data.low_risk_ge60)}</span>`
      );
    }
    if (data.odds_compare_coverage) {
      parts.push(
        `<span class="chip">跨站 ${esc(String(data.odds_compare_coverage).slice(0, 48))}</span>`
      );
    }
    parts.push(rollChip("7日", data.rolling_7d));
    parts.push(rollChip("30日", data.rolling_30d));
    const cal = data.calibration || {};
    if (cal.honesty_zh) {
      parts.push(
        `<span class="chip cal">${esc(
          cal.identity ? "校準：樣本少" : "校準：已套用"
        )}</span>`
      );
    }
    if (data.hit_rate != null) {
      const hr = pct(data.hit_rate);
      const cls = data.hit_rate >= 0.5 ? "ok" : "warn";
      parts.push(`<span class="chip ${cls}">覆盤命中 ${esc(hr)}</span>`);
    }
    const s = data.settlement_summary;
    if (s && s.paper_pnl != null) {
      const cls = s.paper_pnl >= 0 ? "ok" : "bad";
      parts.push(
        `<span class="chip ${cls}">紙注 ${esc(s.paper_pnl)}</span>`
      );
    }
    chips.innerHTML = parts.join("");

    // Calibration honesty strip under chips
    let strip = $("#cal-strip");
    if (!strip) {
      strip = document.createElement("div");
      strip.id = "cal-strip";
      strip.className = "cal-strip";
      chips.parentElement.appendChild(strip);
    }
    const r7 = data.rolling_7d || {};
    const r30 = data.rolling_30d || {};
    strip.innerHTML = `<div>${esc(cal.honesty_zh || "機率校準狀態未載入")}</div>
      <div class="cal-metrics">近7日命中 ${esc(
        r7.hit_rate != null ? pct(r7.hit_rate) : "—"
      )}｜Brier ${esc(r7.brier != null ? Number(r7.brier).toFixed(3) : "—")}（n=${esc(
      r7.n || 0
    )}） · 近30日命中 ${esc(
      r30.hit_rate != null ? pct(r30.hit_rate) : "—"
    )}｜Brier ${esc(
      r30.brier != null ? Number(r30.brier).toFixed(3) : "—"
    )}（n=${esc(r30.n || 0)}）</div>`;
  }

  async function boot() {
    bindTabs();
    try {
      const data = window.__PUMPKIN_EMBEDDED__;
      window.__PUMPKIN_DATA__ = data;
      fillTop(data);
      renderTips(data.tips || []);
      renderReview(data);
      $("#footer-note").textContent =
        data.disclaimer ||
        "紙盤分析，唔係投注建議。估計機率唔保證命中。18歲以下唔准。";
    } catch (e) {
      $("#tips-list").innerHTML =
        '<div class="empty">載入失敗：' + esc(e.message) + "</div>";
    }
  }

  boot();
})();

  </script>
</body>
</html>
