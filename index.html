<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>南瓜仔紙盤</title>
  <style>
:root {
  --bg: #0b0f14;
  --bg2: #121821;
  --card: #171e29;
  --card2: #1c2431;
  --line: #2a3444;
  --text: #e8eef7;
  --muted: #9aa8bc;
  --accent: #3dd68c;
  --accent2: #5b8cff;
  --warn: #f5b942;
  --bad: #ff6b7a;
  --ok: #3dd68c;
  --pill: #243041;
  --radius: 14px;
  --shadow: 0 8px 24px rgba(0,0,0,.35);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body {
  min-height: 100dvh;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: var(--accent2); }

.app {
  max-width: 390px;
  margin: 0 auto;
  padding: 0 12px calc(28px + var(--safe-bottom));
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(11,15,20,.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding: 12px 0 10px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  margin: 0 -12px;
  padding-left: 12px;
  padding-right: 12px;
}

.brand {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.brand h1 {
  margin: 0;
  font-size: 1.15rem;
  font-weight: 750;
  letter-spacing: .02em;
}
.brand .meta {
  color: var(--muted);
  font-size: .78rem;
  text-align: right;
}
.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.chip {
  background: var(--pill);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: .75rem;
}
.chip.ok { border-color: rgba(61,214,140,.45); color: var(--ok); }
.chip.bad { border-color: rgba(255,107,122,.45); color: var(--bad); }
.chip.warn { border-color: rgba(245,185,66,.45); color: var(--warn); }

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 12px 0 14px;
}
.tab {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--bg2);
  color: var(--muted);
  border-radius: 12px;
  padding: 12px 10px;
  font-size: .95rem;
  font-weight: 650;
  min-height: 44px;
  cursor: pointer;
}
.tab.active {
  background: linear-gradient(180deg, #223049, #1a2433);
  color: var(--text);
  border-color: #3a4d6a;
  box-shadow: inset 0 0 0 1px rgba(91,140,255,.25);
}

.panel { display: none; }
.panel.active { display: block; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin: 0 0 12px;
  box-shadow: var(--shadow);
}
.card-head {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: flex-start;
}
.kick {
  color: var(--muted);
  font-size: .78rem;
}
.idpill {
  font-size: .72rem;
  background: var(--pill);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 3px 7px;
  color: var(--muted);
  white-space: nowrap;
}
.tour {
  margin: 6px 0 2px;
  color: var(--muted);
  font-size: .8rem;
}
.teams {
  font-size: 1.05rem;
  font-weight: 700;
  margin: 2px 0 10px;
}

.pick {
  background: var(--card2);
  border: 1px solid #2f3c50;
  border-radius: 12px;
  padding: 12px;
}
.pick-main {
  font-size: 1.12rem;
  font-weight: 750;
  color: var(--accent);
}
.pick-sub {
  margin-top: 4px;
  color: var(--muted);
  font-size: .86rem;
}
.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.pill {
  background: var(--pill);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 10px;
  font-size: .78rem;
}
.pill.status-hit { color: var(--ok); border-color: rgba(61,214,140,.5); }
.pill.status-miss { color: var(--bad); border-color: rgba(255,107,122,.5); }
.pill.status-pending { color: var(--warn); border-color: rgba(245,185,66,.45); }
.pill.conf-high { color: var(--accent); }
.pill.conf-medium { color: var(--accent2); }

.pill.conf-low { color: var(--muted); }

.options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 4px 0 2px;
}
.option {
  background: var(--card2);
  border: 1px solid #2f3c50;
  border-radius: 12px;
  padding: 10px 12px;
  border-left-width: 4px;
}
.option.risk-low { border-left-color: var(--ok); }
.option.risk-medium { border-left-color: var(--accent2); }
.option.risk-high { border-left-color: var(--warn); }
.option-head {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 6px;
}
.risk-badge {
  font-size: .78rem;
  font-weight: 750;
  border-radius: 999px;
  padding: 4px 10px;
  border: 1px solid var(--line);
}
.risk-badge.risk-low {
  color: var(--ok);
  border-color: rgba(61,214,140,.5);
  background: rgba(61,214,140,.08);
}
.risk-badge.risk-medium {
  color: var(--accent2);
  border-color: rgba(91,140,255,.5);
  background: rgba(91,140,255,.08);
}
.risk-badge.risk-high {
  color: var(--warn);
  border-color: rgba(245,185,66,.5);
  background: rgba(245,185,66,.08);
}
.pill.ge60 {
  color: var(--ok);
  border-color: rgba(61,214,140,.55);
  font-weight: 700;
}
.pill.star70 {
  color: #ffd666;
  border-color: rgba(255,214,102,.65);
  background: rgba(255,214,102,.12);
  font-weight: 800;
  letter-spacing: .02em;
}
.option-pick .star-mark {
  color: #ffd666;
  margin-left: 4px;
  font-size: 1.05em;
}
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 4px;
}
.filter-bar button {
  border: 1px solid var(--line);
  background: var(--pill);
  color: var(--muted);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: .78rem;
  cursor: pointer;
}
.filter-bar button.active {
  color: #ffd666;
  border-color: rgba(255,214,102,.65);
  background: rgba(255,214,102,.12);
  font-weight: 700;
}
.option-pick {
  font-size: 1.02rem;
  font-weight: 750;
  color: var(--text);
}
.option.risk-low .option-pick { color: var(--accent); }
.option-prob {
  margin-top: 3px;
  color: var(--muted);
  font-size: .8rem;
}
.option-sum {
  margin: 6px 0 0;
  font-size: .84rem;
  color: var(--muted);
  line-height: 1.4;
}


.summary {
  margin-top: 12px;
  padding: 10px 0 0 10px;
  border-top: 1px dashed #2c384a;
  border-left: 3px solid rgba(61,214,140,.55);
}
.summary h3 {
  margin: 0 0 6px;
  font-size: .85rem;
  color: var(--accent);
  font-weight: 700;
  letter-spacing: .04em;
}
.summary p {
  margin: 0;
  font-size: .92rem;
  color: var(--text);
}

details.more {
  margin-top: 10px;
}
details.more > summary {
  list-style: none;
  cursor: pointer;
  user-select: none;
  background: #141b26;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: .88rem;
  font-weight: 650;
  min-height: 44px;
  display: flex;
  align-items: center;
}
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after {
  content: "＋";
  margin-left: auto;
  color: var(--muted);
}
details.more[open] > summary::after { content: "－"; }
.more-body {
  margin-top: 8px;
  padding: 10px 12px;
  background: #10161f;
  border-radius: 10px;
  border: 1px solid var(--line);
  font-size: .84rem;
  color: var(--muted);
  word-break: break-word;
}
.more-body dt {
  color: var(--accent2);
  font-weight: 650;
  margin-top: 8px;
}
.more-body dd { margin: 2px 0 0; }
.more-body ul { margin: 4px 0 0; padding-left: 1.1em; }

.review-hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.statbox {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
}
.statbox .n {
  font-size: 1.35rem;
  font-weight: 780;
}
.statbox .l {
  color: var(--muted);
  font-size: .75rem;
}
.patterns {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
  font-size: .86rem;
}
.patterns h3 { margin: 0 0 6px; font-size: .9rem; }
.patterns li { margin: 4px 0; color: var(--muted); }

.rev-card .result {
  margin-top: 8px;
  font-size: .88rem;
  color: var(--muted);
}

.footer {
  margin-top: 18px;
  padding: 14px 4px 8px;
  color: var(--muted);
  font-size: .75rem;
  text-align: center;
  border-top: 1px solid var(--line);
}
.empty {
  color: var(--muted);
  text-align: center;
  padding: 28px 10px;
}
.loading { color: var(--muted); padding: 24px 8px; text-align: center; }

.chip.cal { border-color: rgba(91,140,255,.45); color: var(--accent2); }
.pill.cal { border-color: rgba(91,140,255,.4); color: var(--accent2); }
.cal-strip {
  margin-top: 8px;
  padding: 8px 10px;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: .72rem;
  color: var(--muted);
  line-height: 1.4;
}
.cal-strip .cal-metrics { margin-top: 4px; color: var(--text); opacity: .85; }
.review-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }


/* 賽後分析 */
.summary.postmatch h3 { margin: 0 0 6px; font-size: .95rem; }
.summary.postmatch h4 { margin: 8px 0 4px; font-size: .82rem; color: var(--muted); }
.pm-causes, .pm-ext ul { margin: 6px 0 0; padding-left: 1.1rem; font-size: .78rem; color: var(--text); }
.pm-next { margin-top: 8px; font-size: .8rem; color: var(--accent, #f5c842); }
.pm-ext a { color: var(--ok); }

.pill.no-buy {
  color: #ff6b6b;
  border-color: rgba(255,107,107,.55);
  font-weight: 700;
  background: rgba(255,107,107,.1);
}
.pill.buyable {
  color: var(--ok);
  border-color: rgba(61,214,140,.55);
  font-weight: 650;
}
.option.no-buy {
  opacity: 0.82;
}
.option.no-buy .option-pick {
  text-decoration: none;
}


/* 可買清單 */
.buyable-box {
  margin: 0 0 14px;
  padding: 12px 12px 8px;
  background: linear-gradient(180deg, rgba(61,214,140,.08), rgba(23,30,41,.6));
  border: 1px solid rgba(61,214,140,.35);
  border-radius: 14px;
}
.buyable-box.empty-buy {
  background: var(--bg2);
  border-color: var(--line);
}
.buyable-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.buyable-head h2 {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent);
}
.buyable-box.empty-buy .buyable-head h2 { color: var(--muted); }
.buyable-empty {
  padding: 12px 4px 16px;
  font-size: .85rem;
  line-height: 1.45;
}
.buyable-ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.buyable-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 10px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.buyable-row.has-star {
  border-color: rgba(245,200,66,.45);
  box-shadow: inset 0 0 0 1px rgba(245,200,66,.15);
}
.buyable-main { min-width: 0; flex: 1; }
.buyable-match {
  font-weight: 700;
  font-size: .95rem;
  color: var(--text);
}
.buyable-meta {
  margin-top: 2px;
  font-size: .72rem;
  color: var(--muted);
}
.buyable-pick {
  margin-top: 4px;
  font-size: .88rem;
  color: var(--accent);
  font-weight: 650;
}
.buyable-side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
}
@media (max-width: 520px) {
  .buyable-row { flex-direction: column; }
  .buyable-side { flex-direction: row; flex-wrap: wrap; align-items: center; }
}

  </style>
</head>

      (o.est_prob_pct != null && Number(o.est_prob_pct) >= 70);
    const starPill = isStar
      ? '<span class="pill star70" title="校準／估計機率≥70%">⭐ ≥70%</span>'
      : "";
    const calPill = o.calibrated
      ? '<span class="pill cal">已校準</span>'
      : "";
    const notBuy =
      o.buyable === false ||
      o.efficiency === "weak_fill" ||
      (o.recommend_zh && String(o.recommend_zh).includes("唔建議"));
    const buyPill = notBuy
      ? '<span class="pill no-buy" title="弱邊／湊位，唔建議實注">唔建議實注</span>'
      : o.buyable === true
        ? '<span class="pill buyable">可買</span>'
        : "";
    const starMark = isStar ? '<span class="star-mark">⭐</span>' : "";
    return `<div class="option ${riskClass(o.risk_tier)}${isStar ? " has-star" : ""}${notBuy ? " no-buy" : ""}" data-star="${isStar ? "1" : "0"}">
  <div class="option-head">
    <span class="risk-badge ${riskClass(o.risk_tier)}">${esc(
      o.risk_zh || o.risk_tier || "—"
    )}</span>
    ${starPill}${ge60}${calPill}${buyPill}
    <span class="pill ${confClass(o.confidence)}">信心 ${esc(
      o.confidence_zh || o.confidence || "—"
    )}</span>
    <span class="pill">紙注 ${esc(o.stake ?? "—")}</span>
  </div>
  <div class="option-pick">${esc(o.pick_line || "")} ${odds}${starMark}</div>
  <div class="option-prob">${prob}${
      o.prob_label ? ` · ${esc(o.prob_label)}` : ""
    }</div>
  <p class="option-sum">${esc(o.summary || "")}</p>
</div>`;
  }

  let starFilterOn = false;

  function isBuyableOption(o) {
    if (!o) return false;
    if (o.buyable === true) return true;
    if (o.buyable === false) return false;
    if (o.efficiency === "weak_fill") return false;
    if (o.recommend_zh && String(o.recommend_zh).includes("唔建議")) return false;
    if (o.recommend_zh && String(o.recommend_zh).includes("可買")) return true;
    return false;
  }

  function collectBuyable(data) {
    if (data && Array.isArray(data.buyable_list) && data.buyable_list.length) {
      return data.buyable_list;
    }
    // Fallback: derive from tips.options when export older
    const rows = [];
    for (const t of (data && data.tips) || []) {
      const opts =
        t.options && t.options.length
          ? t.options
          : [
              {
                buyable: t.buyable,
                efficiency: t.efficiency,
                recommend_zh: t.recommend_zh,
                risk_tier: t.risk_tier,
                risk_zh: t.risk_zh,
                pick_line: t.pick_line,
                hkjc_odds: t.hkjc_odds,
                est_prob_pct: t.est_prob_pct,
                star: t.star,
                calibrated: t.calibrated,
                confidence_zh: t.confidence_zh,
                stake: t.stake,
                market: t.market,
                market_label: t.market_label,
                pick: t.pick,
              },
            ];
      for (const o of opts) {
        if (!isBuyableOption(o)) continue;
        const pct = o.est_prob_pct;
        const starred =
          o.star === true || (pct != null && Number(pct) >= 70);
        rows.push({
          front_end_id: t.front_end_id,
          kickoff_hkt: t.kickoff_hkt,
          tournament: t.tournament,
          match_label:
            ((t.home && t.home.ch) || "?") +
            " vs " +
            ((t.away && t.away.ch) || "?"),
          risk_tier: o.risk_tier,
          risk_zh: o.risk_zh,
          pick_line: o.pick_line,
          hkjc_odds: o.hkjc_odds,
          est_prob_pct: pct,
          calibrated: o.calibrated,
          star: starred,
          star_zh: starred ? "⭐" : null,
          recommend_zh: o.recommend_zh || "可買（紙盤）",
          confidence_zh: o.confidence_zh,
          stake: o.stake,
        });
      }
    }
    rows.sort((a, b) => {
      if (!!b.star - !!a.star) return !!b.star - !!a.star;
      return (Number(b.est_prob_pct) || -1) - (Number(a.est_prob_pct) || -1);
    });
    return rows;
  }

  function renderBuyableList(data) {
    let root = $("#buyable-list");
    const panel = $("#panel-tips");

    const rows =
      data && typeof data.buyable_count === "number" && Array.isArray(data.buyable_list)
        ? data.buyable_list

      data && typeof data.buyable_count === "number"
        ? data.buyable_count

    if (!n) {
      root.innerHTML = `<section class="buyable-box empty-buy">

</section>`;

    root.innerHTML = `<section class="buyable-box">

  </div>
  <ul class="buyable-ul">
    ${rows
      .map((r) => {

            ? `${calTag} ${esc(r.est_prob_pct)}%`

        const starPill = r.star
          ? '<span class="pill star70">⭐ ≥70%</span>'
          : "";
        return `<li class="buyable-row${r.star ? " has-star" : ""}">
  <div class="buyable-main">

  </div>
  <div class="buyable-side">

      r.risk_zh || r.risk_tier || "—"

    <span class="pill buyable">可買</span>
    ${starPill}

  function renderTips(tips, data) {

    const filtered = starFilterOn

          return opts.some(

        return `<article class="card" data-id="${esc(t.front_end_id)}">
  <div class="card-head">
    <div class="kick">${esc(t.kickoff_hkt)} HKT</div>
    <div class="idpill">${esc(t.front_end_id)}</div>
  </div>

      t.status_zh || "待結"

  <div class="summary">

  <details class="more">

    <div class="more-body">
      <dl>

        }${

            : ""
        }

          t.form
            ? `<dt>近況</dt><dd>主 ${esc(t.form[0] || "—")}／客 ${esc(
                t.form[1] || "—"
              )}</dd>`
            : ""
        }
        ${
          t.h2h_summary
            ? `<dt>對賽</dt><dd>主勝${esc(t.h2h_summary[0])}／和${esc(
                t.h2h_summary[1]
              )}／客勝${esc(t.h2h_summary[2])}</dd>`
            : ""

          t.review_zh

            : ""

      .join("");

  function bindStarFilter(tips, data) {
    const starBtn = $("#filter-star");
    const allBtn = $("#filter-all");
    if (starBtn) {
      starBtn.onclick = () => {
        starFilterOn = true;
        renderTips(tips, data);
      };
    }
    if (allBtn) {
      allBtn.onclick = () => {
        starFilterOn = false;
        renderTips(tips, data);
      };
    }
  }

  function bindTabs() {
    $$(".tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        $$(".tab").forEach((b) => b.classList.remove("active"));
        $$(".panel").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        const id = btn.getAttribute("data-tab");
        $("#panel-" + id).classList.add("active");
      });
    });
  }

  function rollChip(label, roll) {
    if (!roll || roll.n == null || roll.n === 0) {
      return `<span class="chip">${esc(label)} n=0</span>`;
    }
    const hr = roll.hit_rate != null ? pct(roll.hit_rate) : "—";
    const br = roll.brier != null ? Number(roll.brier).toFixed(3) : "—";
    const cls = roll.hit_rate != null && roll.hit_rate >= 0.5 ? "ok" : "warn";
    return `<span class="chip ${cls}">${esc(label)} ${esc(hr)}｜Brier ${esc(br)}（n=${esc(roll.n)}）</span>`;
  }

  function fillTop(data) {
    $("#as-of").textContent = data.as_of_hkt || "—";
    const chips = $("#stat-chips");
    const parts = [
      `<span class="chip">場次 ${esc(data.matches_count || data.tips_count)}</span>`,
    ];
    if (data.options_total != null) {
      parts.push(`<span class="chip">選項 ${esc(data.options_total)}</span>`);
    }
    if (data.low_risk_ge60 != null) {
      parts.push(
        `<span class="chip ok">低風險≥60% ${esc(data.low_risk_ge60)}</span>`
      );
    }
    if (data.star_ge70 != null) {
      parts.push(
        `<span class="chip ok">⭐≥70% ${esc(data.star_ge70)}</span>`
      );
    }
    if (data.buyable_count != null) {
      const bc = Number(data.buyable_count) || 0;
      parts.push(
        `<span class="chip ${bc > 0 ? "ok" : "warn"}">可買 ${esc(bc)}</span>`
      );
    }
    if (data.odds_compare_coverage) {
      parts.push(
        `<span class="chip">跨站 ${esc(String(data.odds_compare_coverage).slice(0, 48))}</span>`
      );
    }
    parts.push(rollChip("7日", data.rolling_7d));
    parts.push(rollChip("30日", data.rolling_30d));
    const cal = data.calibration || {};
    if (cal.honesty_zh) {
      parts.push(
        `<span class="chip cal">${esc(
          cal.identity ? "校準：樣本少" : "校準：已套用"
        )}</span>`
      );
    }
    if (data.hit_rate != null) {
      const hr = pct(data.hit_rate);
      const cls = data.hit_rate >= 0.5 ? "ok" : "warn";
      parts.push(`<span class="chip ${cls}">覆盤命中 ${esc(hr)}</span>`);
    }
    const s = data.settlement_summary;
    if (s && s.paper_pnl != null) {
      const cls = s.paper_pnl >= 0 ? "ok" : "bad";
      parts.push(
        `<span class="chip ${cls}">紙注 ${esc(s.paper_pnl)}</span>`
      );
    }
    chips.innerHTML = parts.join("");

    // Calibration honesty strip under chips
    let strip = $("#cal-strip");
    if (!strip) {
      strip = document.createElement("div");
      strip.id = "cal-strip";
      strip.className = "cal-strip";
      chips.parentElement.appendChild(strip);
    }
    const r7 = data.rolling_7d || {};
    const r30 = data.rolling_30d || {};
    strip.innerHTML = `<div>${esc(cal.honesty_zh || "機率校準狀態未載入")}</div>
      <div class="cal-metrics">近7日命中 ${esc(
        r7.hit_rate != null ? pct(r7.hit_rate) : "—"
      )}｜Brier ${esc(r7.brier != null ? Number(r7.brier).toFixed(3) : "—")}（n=${esc(
      r7.n || 0
    )}） · 近30日命中 ${esc(
      r30.hit_rate != null ? pct(r30.hit_rate) : "—"
    )}｜Brier ${esc(
      r30.brier != null ? Number(r30.brier).toFixed(3) : "—"
    )}（n=${esc(r30.n || 0)}）</div>`;
  }

  async function boot() {
    bindTabs();
    try {
      const data = window.__PUMPKIN_EMBEDDED__;
      window.__PUMPKIN_DATA__ = data;
      fillTop(data);
      renderBuyableList(data);
      renderTips(data.tips || [], data);
      renderReview(data);
      $("#footer-note").textContent =
        data.disclaimer ||
        "紙盤分析，唔係投注建議。估計機率唔保證命中。18歲以下唔准。";
    } catch (e) {
      $("#tips-list").innerHTML =
        '<div class="empty">載入失敗：' + esc(e.message) + "</div>";
    }
  }

  boot();
})();

  </script>
</body>
</html>
